name: Control Plane CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Set up pyenv
        uses: gabrielfalcao/pyenv-action@v18
        with:
          default: 3.12.7
      - name: Install pyenv-virtualenv
        run: git clone --depth 1 https://github.com/pyenv/pyenv-virtualenv.git "$(pyenv root)/plugins/pyenv-virtualenv"
      - run: npm ci
      - run: bash scripts/ci.sh
        env:
          OPENCODE_DEPLOY_CONFIG_DIR: ${{ runner.temp }}/opencode-config
