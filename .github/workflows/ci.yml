name: Goal Agent Profile CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Install virtual-display test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: bash scripts/ci.sh
        env:
          CUDDLY_WINNER_CI_PROFILE_PARENT: ${{ runner.temp }}
